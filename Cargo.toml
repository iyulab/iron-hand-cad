[package]
name = "iron-hand-cad"
version = "0.1.0"
edition = "2021"
# Minimum supported Rust version. Measured, not guessed, and checked by CI's
# `msrv` job with exactly this toolchain -- raise the two together.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/iyulab/iron-hand-cad"
homepage = "https://github.com/iyulab/iron-hand-cad"
readme = "README.md"
description = "Deterministic hands for CAD drawings: apply an exact edit to the entity a reference points at in an uncad-model drawing, and return the new state."
keywords = ["cad", "dxf", "edit", "geometry"]
categories = ["algorithms", "data-structures"]

[lints.rust]
# Plain data in, plain data out: there is no reason for `unsafe` here.
unsafe_code = "forbid"

[lints.clippy]
# Same input, same bytes: nothing this crate outputs may depend on a hash
# collection's iteration order, which `std` randomizes per instance. The main
# guard is clippy.toml's `disallowed-types`; this restriction lint additionally
# covers `for` loops over any other hash-based type.
iter_over_hash_type = "warn"

[dependencies]
# The model the drawing is expressed in. A version dependency, never a path:
# this crate must build from a standalone checkout.
uncad-model = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
# The value a field is set to is given in the model's own JSON form, and the
# edit is carried out on that form: one field vocabulary for the editor and
# for the diff that verifies it.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
# Whether an edit did exactly what was asked is established by the numeric
# diff, so the acceptance tests run it. A version dependency, never a path.
iron-diff-cad = "0.1.0"
